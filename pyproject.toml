[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "insureport"
version = "0.1.0"
description = "Safe-haven portfolio insurance analyzer: does portfolio insurance raise geometric return?"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "yfinance>=0.2.50",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
case-study = ["kaleido>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insureport = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
